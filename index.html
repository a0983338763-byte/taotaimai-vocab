<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff9a7c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="桃太妹種單字｜中文正面、英文背面的個人單字卡。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<title>桃太妹種單字</title>
<style>
:root{
  --ink:#21464a;--ink2:#557176;--cream:#fff8eb;--paper:#fffdf8;--white:#fff;
  --peach:#ff9a7c;--peach2:#f67462;--sun:#ffd56f;--sea:#70cbd0;--sea2:#3f9ea8;
  --mint:#aee2c8;--leaf:#58a77d;--sand:#f3d39c;--yellow:#ffe9a9;--pink:#ffe3dc;
  --line:rgba(34,77,81,.12);--shadow:0 20px 55px rgba(50,87,90,.14);--soft:0 10px 24px rgba(50,87,90,.10)
}
*{box-sizing:border-box}
html{background:var(--cream);scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:ui-rounded,"SF Pro Rounded","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink);background:
radial-gradient(circle at 12% 2%,rgba(255,213,111,.42),transparent 26%),
radial-gradient(circle at 92% 13%,rgba(112,203,208,.25),transparent 24%),
linear-gradient(180deg,#fff8ea 0%,#fffdf8 49%,#eefaf7 100%);overflow-x:hidden}
button,select,input{font:inherit}button{-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid rgba(63,158,168,.26);outline-offset:2px}
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.bg-deco:before,.bg-deco:after{content:"";position:absolute;border-radius:50%;filter:blur(1px)}
.bg-deco:before{width:240px;height:240px;background:rgba(255,154,124,.10);left:-120px;top:42%}
.bg-deco:after{width:300px;height:300px;background:rgba(112,203,208,.12);right:-150px;top:62%}
.shell{width:min(820px,100%);margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(32px + env(safe-area-inset-bottom))}

/* HERO */
.hero{position:relative;min-height:250px;overflow:hidden;border-radius:32px;padding:24px 22px;margin-bottom:12px;background:linear-gradient(150deg,#fffdf8 0%,#fff1df 55%,#dcf3ef 100%);border:1px solid rgba(255,255,255,.86);box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;width:330px;height:90px;border-radius:50%;background:rgba(112,203,208,.23);right:-50px;bottom:-41px;transform:rotate(-4deg)}
.hero-copy{position:relative;z-index:5;width:60%}
.eyebrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}.vacay-badge{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;padding:7px 10px;border-radius:10px;font-size:10px;font-weight:1000;letter-spacing:.12em;transform:rotate(-1.5deg);box-shadow:0 6px 0 rgba(33,70,74,.08)}.mini-badge{font-size:11px;font-weight:900;color:var(--peach2)}
h1{margin:0;font-size:clamp(36px,8vw,54px);line-height:.98;letter-spacing:-.065em;font-weight:1000}.peach-word{display:block;color:var(--peach2);text-shadow:0 3px 0 rgba(255,255,255,.8)}
.tagline{margin:12px 0 0;max-width:28ch;color:var(--ink2);font-size:14px;line-height:1.72;font-weight:750}.install-btn{margin-top:12px;border:0;border-radius:999px;background:#fff;color:var(--sea2);padding:10px 14px;font-weight:900;box-shadow:var(--soft);cursor:pointer}
.scene{position:absolute;right:7px;bottom:7px;width:270px;height:220px;z-index:2}
.sun{position:absolute;right:8px;top:3px;width:64px;height:64px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 10px rgba(255,213,111,.16)}
.cloud{position:absolute;width:72px;height:22px;border-radius:999px;background:rgba(255,255,255,.92)}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:30px;height:30px;left:10px;top:-15px}.cloud:after{width:39px;height:39px;right:7px;top:-22px}.cl1{right:101px;top:25px;transform:scale(.7)}.cl2{right:-13px;top:83px;transform:scale(.48)}
.island{position:absolute;left:37px;bottom:27px;width:215px;height:48px;border-radius:52% 48% 44% 46%;background:var(--sand);transform:rotate(-3deg);box-shadow:inset 0 -7px 0 rgba(205,158,97,.12)}
.wave{position:absolute;left:0;right:-22px;height:35px;border-radius:60% 40% 0 0;background:rgba(112,203,208,.35)}.w1{bottom:6px;transform:rotate(-2deg)}.w2{left:45px;bottom:-10px;opacity:.75;transform:rotate(2deg)}
.palm{position:absolute;left:18px;bottom:48px;width:122px;height:150px;transform:rotate(-5deg)}.trunk{position:absolute;left:55px;bottom:0;width:18px;height:111px;border-radius:50% 50% 38% 38%;background:#b9825d;transform:rotate(9deg);box-shadow:inset -4px 0 rgba(100,65,47,.10)}.leaf{position:absolute;width:78px;height:24px;border-radius:100% 0 100% 0;background:var(--leaf);transform-origin:right center}.l1{left:-2px;top:23px;transform:rotate(7deg)}.l2{left:19px;top:3px;transform:rotate(39deg)}.l3{right:-5px;top:16px;transform:scaleX(-1) rotate(9deg)}.l4{right:11px;top:-5px;transform:scaleX(-1) rotate(42deg)}
.surf{position:absolute;right:4px;bottom:32px;width:28px;height:112px;border-radius:50% 50% 48% 48%;background:linear-gradient(180deg,#fff 0 28%,var(--peach) 28% 53%,var(--sun) 53% 76%,var(--sea) 76%);transform:rotate(14deg);box-shadow:0 8px 18px rgba(50,87,90,.13);border:3px solid rgba(255,255,255,.85)}
.peach{position:absolute;right:50px;bottom:40px;width:94px;height:88px;border-radius:48% 48% 53% 53% / 44% 44% 60% 60%;background:linear-gradient(145deg,#ffb094,#ff836a);box-shadow:inset -9px -7px rgba(214,93,75,.10),0 13px 20px rgba(117,80,63,.14);transform:rotate(4deg)}.peach:before,.peach:after{content:"";position:absolute;bottom:-5px;width:20px;height:9px;border-radius:50%;background:var(--sand)}.peach:before{left:17px;transform:rotate(-9deg)}.peach:after{right:17px;transform:rotate(8deg)}.peach-leaf{position:absolute;right:11px;top:-10px;width:34px;height:17px;border-radius:100% 0 100% 0;background:#6ca37e;transform:rotate(-24deg)}.glass{position:absolute;top:31px;width:27px;height:18px;border-radius:5px 5px 11px 11px;background:#2e4850}.g1{left:16px;transform:rotate(5deg)}.g2{right:16px;transform:rotate(-5deg)}.bridge{position:absolute;top:36px;left:42px;width:11px;height:4px;border-radius:999px;background:#2e4850}.smile{position:absolute;left:38px;top:57px;width:19px;height:10px;border-bottom:3px solid #a34c47;border-radius:0 0 18px 18px}.arm{position:absolute;width:30px;height:8px;border-radius:999px;background:#ff8d72;top:58px}.a1{left:-20px;transform:rotate(28deg)}.a2{right:-20px;transform:rotate(-28deg)}

/* SUMMARY */
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.sum{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i l" "i n";align-items:center;column-gap:8px;padding:12px 10px;border-radius:18px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.9);box-shadow:var(--soft)}.sum:after{content:"";position:absolute;width:38px;height:38px;border-radius:50%;right:-13px;bottom:-17px;background:rgba(255,255,255,.55)}.sum-icon{grid-area:i;font-size:20px}.sum span:not(.sum-icon){grid-area:l;color:var(--ink2);font-size:10px;font-weight:900}.sum strong{grid-area:n;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}.sum.total{background:linear-gradient(145deg,#fff8e8,#ffefc6)}.sum.know{background:linear-gradient(145deg,#edf9f3,#dff3e7)}.sum.unsure{background:linear-gradient(145deg,#fff9e7,#fff0bf)}.sum.miss{background:linear-gradient(145deg,#fff2ee,#ffe1da)}

/* CONTROLS */
.panel{padding:16px;border-radius:24px;background:rgba(255,255,255,.84);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.92);box-shadow:var(--soft);margin-bottom:14px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px}.panel-kicker{color:var(--sea2);font-size:9px;font-weight:1000;letter-spacing:.15em}.panel h2{margin:3px 0 0;font-size:18px;letter-spacing:-.02em}.stamp{padding:7px 9px;border:1.5px dashed rgba(246,116,98,.45);border-radius:7px;color:var(--peach2);font-size:8px;font-weight:1000;letter-spacing:.11em;transform:rotate(2deg)}.group{display:grid;gap:7px}.group+.group{margin-top:12px}.label{font-size:11px;color:var(--ink2);font-weight:900}.chip-row{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 3px;scrollbar-width:none}.chip-row::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;min-width:47px;height:39px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:950;cursor:pointer;box-shadow:0 5px 12px rgba(50,87,90,.05)}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);transform:translateY(-1px)}.control-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:9px;margin-top:12px}.select{width:100%;height:48px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:850}.switch{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:14px;background:#f5fbfa;border:1px solid rgba(63,158,168,.12);cursor:pointer}.switch strong{display:block;font-size:12px}.switch small{display:block;margin-top:2px;color:var(--ink2);font-size:9px}.switch input{appearance:none;width:42px;height:24px;border-radius:999px;background:#d7e7e5;position:relative;transition:.2s;flex:0 0 auto}.switch input:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.13);transition:.2s}.switch input:checked{background:var(--sea2)}.switch input:checked:before{transform:translateX(18px)}

/* STUDY CARD */
.study{position:relative}.empty{padding:30px 20px;text-align:center;border-radius:24px;background:#fff;box-shadow:var(--soft)}.empty-emoji{font-size:42px}.empty h2{margin:8px 0 4px;font-size:19px}.empty p{margin:0;color:var(--ink2);font-size:13px}.progress-top{display:flex;align-items:center;justify-content:space-between;margin:0 3px 7px;color:var(--ink2);font-size:12px;font-weight:900}.status{display:inline-flex;align-items:center;justify-content:center;min-width:68px;padding:5px 9px;border-radius:999px;background:#edf3f2;color:var(--ink2);font-size:10px}.status[data-status="know"]{background:#e1f4e9;color:#39785c}.status[data-status="unsure"]{background:#fff1bf;color:#8d6a17}.status[data-status="miss"]{background:#ffe3dd;color:#aa5548}.track{height:8px;border-radius:999px;background:rgba(36,78,82,.08);overflow:hidden;margin-bottom:14px}.bar{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--sea),var(--peach));transition:width .25s ease}.postcard-wrap{position:relative;padding:7px 3px 4px}.tape{position:absolute;width:61px;height:20px;z-index:6;background:rgba(255,233,169,.77);box-shadow:0 1px 2px rgba(0,0,0,.04)}.tape-left{left:27px;top:0;transform:rotate(-6deg)}.tape-right{right:27px;top:0;transform:rotate(6deg)}.flashcard{position:relative;display:block;width:100%;height:330px;border:0;padding:0;background:transparent;perspective:1200px;cursor:pointer}.card-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .58s cubic-bezier(.2,.7,.2,1);box-shadow:0 24px 55px rgba(49,83,87,.16);overflow:hidden}.card-front{background:linear-gradient(145deg,#fffdf8,#fff7e9);border:2px solid rgba(246,116,98,.12)}.card-front:before{content:"";position:absolute;inset:14px;border:1.5px dashed rgba(246,116,98,.22);border-radius:19px;pointer-events:none}.card-front:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-53px;bottom:-55px;background:rgba(255,213,111,.17)}.card-back{transform:rotateY(180deg);background:linear-gradient(145deg,#eaf9f5,#dff5f2);border:2px solid rgba(63,158,168,.13)}.card-back:before{content:"";position:absolute;left:-48px;bottom:-50px;width:160px;height:100px;border-radius:50%;background:rgba(112,203,208,.19)}.flashcard.flipped .card-front{transform:rotateY(180deg)}.flashcard.flipped .card-back{transform:rotateY(360deg)}.meta{position:absolute;top:27px;left:25px;display:flex;gap:7px;z-index:2}.id,.pos{display:inline-flex;align-items:center;min-height:30px;padding:6px 10px;border-radius:999px;font-weight:950;font-size:11px}.id{background:var(--ink);color:#fff}.pos{background:#fff2de;color:var(--peach2);border:1px solid rgba(246,116,98,.13)}.front-label,.back-label{margin-bottom:13px;font-size:10px;font-weight:1000;letter-spacing:.16em;color:var(--peach2)}.back-label{color:var(--sea2)}.main{position:relative;z-index:2;max-width:92%;text-align:center;font-weight:1000;line-height:1.28}.zh{font-size:clamp(29px,7.3vw,45px);letter-spacing:-.045em}.en{font-size:clamp(34px,9vw,54px);letter-spacing:-.04em;color:#236d76}.flip-hint{position:absolute;bottom:24px;color:var(--ink2);font-size:10px;font-weight:800}.corner{position:absolute;right:25px;top:23px;font-size:26px;color:var(--sun);transform:rotate(10deg)}.postmark{position:absolute;right:23px;top:23px;width:59px;height:59px;border-radius:50%;display:grid;place-items:center;text-align:center;border:2px dashed rgba(63,158,168,.34);color:rgba(63,158,168,.65);font-size:8px;line-height:1.15;font-weight:1000;letter-spacing:.08em;transform:rotate(9deg)}.back-actions{position:absolute;bottom:20px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.back-actions .flip-hint{position:static}.sound{display:inline-flex;align-items:center;gap:5px;padding:9px 11px;border-radius:999px;background:#fff;color:var(--sea2);box-shadow:var(--soft);font-size:11px;font-weight:950}
.rating-title{text-align:center;margin:16px 0 8px;color:var(--ink2);font-size:11px;font-weight:900}.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rating{min-height:54px;border:1px solid var(--line);border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);font-weight:950;cursor:pointer;box-shadow:0 7px 18px rgba(50,87,90,.06);transition:.15s}.rating:active{transform:scale(.97)}.rating.miss{background:#fff5f2}.rating.unsure{background:#fffaf0}.rating.know{background:#f2fbf6}.rating.selected{border-color:transparent;box-shadow:0 0 0 3px rgba(33,70,74,.08),0 7px 18px rgba(50,87,90,.06)}.rating-key{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:rgba(33,70,74,.07);font-size:10px}.nav{display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-top:10px}.nav-btn{height:50px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:950;cursor:pointer}.nav-btn.primary{border:0;background:linear-gradient(135deg,var(--ink),#356f75);color:#fff;box-shadow:0 10px 22px rgba(33,70,74,.17)}.nav-btn:disabled{opacity:.38;cursor:not-allowed}
.footer{padding:16px 2px 2px}.footer-card{display:flex;align-items:center;gap:10px;padding:13px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9)}.footer-peach{font-size:28px}.footer strong{font-size:12px}.footer p{margin:3px 0 0;color:var(--ink2);font-size:10px;line-height:1.5}.reset{display:block;margin:12px auto 0;border:0;background:transparent;color:#9a6b64;font-size:11px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.ios{text-align:center;color:var(--ink2);font-size:9px;line-height:1.55;margin:10px 10px 0}.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:99;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:10px 14px;border-radius:999px;background:rgba(33,70,74,.94);color:#fff;font-size:11px;font-weight:900;box-shadow:var(--shadow);transition:.22s}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:610px){.shell{padding-left:10px;padding-right:10px}.hero{min-height:220px;padding:20px 17px;border-radius:27px}.hero-copy{width:58%}.tagline{font-size:12px;line-height:1.58}.scene{width:220px;height:185px;right:-8px;bottom:3px}.sun{width:51px;height:51px}.palm{transform:scale(.84) rotate(-5deg);transform-origin:left bottom}.island{width:175px;left:35px}.peach{right:41px;bottom:37px;transform:scale(.85) rotate(4deg)}.surf{right:2px;bottom:27px;transform:scale(.82) rotate(14deg)}.summary{gap:6px}.sum{padding:10px 8px;column-gap:5px;border-radius:15px}.sum-icon{font-size:17px}.sum strong{font-size:19px}.sum span:not(.sum-icon){font-size:9px}.panel{padding:14px;border-radius:21px}.control-grid{grid-template-columns:1fr}.flashcard{height:305px}.card-face{border-radius:24px;padding:27px 18px}.ratings{gap:6px}.rating{min-height:51px;font-size:13px}.nav-btn{height:48px}}
@media(max-width:390px){h1{font-size:36px}.hero-copy{width:61%}.tagline{font-size:11px}.scene{right:-28px;transform:scale(.93);transform-origin:right bottom}.summary{grid-template-columns:repeat(2,1fr)}.flashcard{height:290px}.zh{font-size:29px}.en{font-size:35px}}
@media(min-width:760px){.hero{min-height:275px}.scene{transform:scale(1.12);transform-origin:right bottom}.flashcard{height:370px}.panel,.card-section{max-width:720px;margin-left:auto;margin-right:auto}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

<body>
  <div class="bg-deco" aria-hidden="true"></div>
  <div class="shell">
    <header class="hero">
      <div class="hero-copy">
        <div class="eyebrow"><span class="vacay-badge">VACAY VOCAB ✦</span><span class="mini-badge">個人單字卡</span></div>
        <h1>桃太妹<span class="peach-word">種單字</span></h1>
        <p class="tagline">中文先想，英文再翻。每天種一點，單字慢慢長出來。</p>
        <button id="installBtn" class="install-btn" hidden>加入手機主畫面</button>
      </div>
      <div class="scene" aria-hidden="true">
        <div class="sun"></div><div class="cloud cl1"></div><div class="cloud cl2"></div>
        <div class="palm"><span class="trunk"></span><span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span><span class="leaf l4"></span></div>
        <div class="island"></div><div class="surf"></div>
        <div class="peach"><span class="peach-leaf"></span><span class="glass g1"></span><span class="glass g2"></span><span class="bridge"></span><span class="smile"></span><span class="arm a1"></span><span class="arm a2"></span></div>
        <div class="wave w1"></div><div class="wave w2"></div>
      </div>
    </header>

    <section class="summary" aria-label="學習摘要">
      <div class="sum total"><span class="sum-icon">🏝️</span><span>總單字</span><strong id="totalCount">0</strong></div>
      <div class="sum know"><span class="sum-icon">🌴</span><span>會了</span><strong id="knownCount">0</strong></div>
      <div class="sum unsure"><span class="sum-icon">🌤️</span><span>模糊</span><strong id="unsureCount">0</strong></div>
      <div class="sum miss"><span class="sum-icon">🍑</span><span>不會</span><strong id="missedCount">0</strong></div>
    </section>

    <section class="panel" aria-label="複習篩選">
      <div class="panel-head"><div><span class="panel-kicker">CHOOSE YOUR TRIP</span><h2>今天要背哪一區？</h2></div><span class="stamp">POSTCARD</span></div>
      <div class="group"><span class="label">字母分類</span><div id="letterFilters" class="chip-row"></div></div>
      <div class="control-grid">
        <label class="group"><span class="label">複習範圍</span><select id="modeSelect" class="select"><option value="all">全部單字</option><option value="today">今日新增</option><option value="unrated">未作答</option><option value="miss">只看不會</option><option value="unsure">只看模糊</option></select></label>
        <label class="switch"><span><strong>隨機順序</strong><small>打亂目前範圍</small></span><input id="shuffleToggle" type="checkbox"></label>
      </div>
    </section>

    <main class="study">
      <div id="emptyState" class="empty" hidden><div class="empty-emoji">🧳</div><h2>這一區目前沒有單字</h2><p>換個字母或複習範圍再看看。</p></div>
      <section id="cardSection" class="card-section">
        <div class="progress-top"><span id="positionLabel">1 / 1</span><span id="statusLabel" class="status">未作答</span></div>
        <div class="track"><div id="progressBar" class="bar"></div></div>
        <div class="postcard-wrap"><span class="tape tape-left"></span><span class="tape tape-right"></span>

<script>
(() => {
  'use strict';

  const STORAGE_PROGRESS = 'taotao-vocab-progress-v2';
  const STORAGE_PREFS = 'taotao-vocab-prefs-v2';

  const els = {
    totalCount: document.querySelector('#totalCount'),
    knownCount: document.querySelector('#knownCount'),
    unsureCount: document.querySelector('#unsureCount'),
    missedCount: document.querySelector('#missedCount'),
    letterFilters: document.querySelector('#letterFilters'),
    modeSelect: document.querySelector('#modeSelect'),
    shuffleToggle: document.querySelector('#shuffleToggle'),
    cardSection: document.querySelector('#cardSection'),
    emptyState: document.querySelector('#emptyState'),
    flashcard: document.querySelector('#flashcard'),
    cardId: document.querySelector('#cardId'),
    cardPos: document.querySelector('#cardPos'),
    cardZh: document.querySelector('#cardZh'),
    cardEn: document.querySelector('#cardEn'),
    speakBtn: document.querySelector('#speakBtn'),
    positionLabel: document.querySelector('#positionLabel'),
    statusLabel: document.querySelector('#statusLabel'),
    progressBar: document.querySelector('#progressBar'),
    prevBtn: document.querySelector('#prevBtn'),
    nextBtn: document.querySelector('#nextBtn'),
    ratingButtons: [...document.querySelectorAll('[data-rating]')],
    resetBtn: document.querySelector('#resetBtn'),
    toast: document.querySelector('#toast'),
    installBtn: document.querySelector('#installBtn')
  };

  const vocabulary = Array.isArray(window.VOCABULARY) ? window.VOCABULARY : [];
  const letters = ['all', ...new Set(vocabulary.map(item => item.letter).filter(Boolean))];

  const statusText = {
    unrated: '未作答',
    miss: '不會',
    unsure: '模糊',
    know: '會了'
  };

  let progress = readJSON(STORAGE_PROGRESS, {});
  const savedPrefs = readJSON(STORAGE_PREFS, {});
  let prefs = {
    letter: savedPrefs.letter || 'all',
    mode: savedPrefs.mode || 'all',
    shuffle: Boolean(savedPrefs.shuffle),
    lastId: savedPrefs.lastId || null
  };
  let deck = [];
  let index = 0;
  let installPrompt = null;
  let toastTimer = null;

  function readJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  }

  function saveProgress() {
    localStorage.setItem(STORAGE_PROGRESS, JSON.stringify(progress));
  }

  function savePrefs() {
    localStorage.setItem(STORAGE_PREFS, JSON.stringify(prefs));
  }

  function localDateISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function shuffleArray(items) {
    const arr = [...items];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function getStatus(id) {
    return progress[id]?.status || 'unrated';
  }

  function buildLetterFilters() {
    els.letterFilters.innerHTML = '';
    for (const letter of letters) {
      const button = document.createElement('button');
      button.className = 'chip';
      button.dataset.letter = letter;
      button.type = 'button';
      button.textContent = letter === 'all' ? '全部' : letter;
      els.letterFilters.appendChild(button);
    }
  }

  function filteredDeck() {
    let items = vocabulary.filter(word => prefs.letter === 'all' || word.letter === prefs.letter);

    if (prefs.mode === 'today') {
      const today = localDateISO();
      items = items.filter(word => word.addedDate === today);
    } else if (prefs.mode === 'unrated') {
      items = items.filter(word => getStatus(word.id) === 'unrated');
    } else if (prefs.mode === 'miss') {
      items = items.filter(word => getStatus(word.id) === 'miss');
    } else if (prefs.mode === 'unsure') {
      items = items.filter(word => getStatus(word.id) === 'unsure');
    }

    return prefs.shuffle ? shuffleArray(items) : items;
  }

  function rebuildDeck({ keepCurrent = true } = {}) {
    const currentId = keepCurrent && deck[index] ? deck[index].id : prefs.lastId;
    deck = filteredDeck();

    if (deck.length === 0) {
      index = 0;
      render();
      return;
    }

    const sameIndex = currentId ? deck.findIndex(word => word.id === currentId) : -1;
    index = sameIndex >= 0 ? sameIndex : 0;
    prefs.lastId = deck[index].id;
    savePrefs();
    render();
  }

  function renderSummary() {
    const counts = { know: 0, unsure: 0, miss: 0 };
    for (const word of vocabulary) {
      const status = getStatus(word.id);
      if (counts[status] !== undefined) counts[status] += 1;
    }
    els.totalCount.textContent = vocabulary.length;
    els.knownCount.textContent = counts.know;
    els.unsureCount.textContent = counts.unsure;
    els.missedCount.textContent = counts.miss;
  }

  function renderFilters() {
    els.letterFilters.querySelectorAll('[data-letter]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.letter === prefs.letter);
    });
    els.modeSelect.value = prefs.mode;
    els.shuffleToggle.checked = prefs.shuffle;
  }

  function render() {
    renderSummary();
    renderFilters();

    const empty = deck.length === 0;
    els.emptyState.hidden = !empty;
    els.cardSection.hidden = empty;
    if (empty) return;

    const word = deck[index];
    const status = getStatus(word.id);

    els.flashcard.classList.remove('flipped');
    els.cardId.textContent = word.id;
    els.cardPos.textContent = word.pos;
    els.cardZh.textContent = word.zh;
    els.cardEn.textContent = word.en;
    els.positionLabel.textContent = `${index + 1} / ${deck.length}`;
    els.progressBar.style.width = `${((index + 1) / deck.length) * 100}%`;
    els.statusLabel.textContent = statusText[status];
    els.statusLabel.dataset.status = status;

    els.ratingButtons.forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.rating === status);
      btn.setAttribute('aria-pressed', String(btn.dataset.rating === status));
    });

    els.prevBtn.disabled = index === 0;
    els.nextBtn.disabled = index === deck.length - 1;
    prefs.lastId = word.id;
    savePrefs();
  }

  function move(step) {
    if (!deck.length) return;
    const next = Math.min(deck.length - 1, Math.max(0, index + step));
    if (next === index) return;
    index = next;
    render();
  }

  function rate(status) {
    const word = deck[index];
    if (!word) return;
    progress[word.id] = { status, updatedAt: new Date().toISOString() };
    saveProgress();
    renderSummary();

    if ((prefs.mode === 'miss' && status !== 'miss') ||
        (prefs.mode === 'unsure' && status !== 'unsure') ||
        prefs.mode === 'unrated') {
      rebuildDeck({ keepCurrent: false });
      return;
    }

    render();
    if (index < deck.length - 1) {
      setTimeout(() => move(1), 120);
    } else {
      showToast('已記錄這張單字');
    }
  }

  function speakCurrent() {
    const word = deck[index];
    if (!word || !('speechSynthesis' in window)) {
      showToast('此瀏覽器不支援語音朗讀');
      return;
    }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word.en);
    utter.lang = 'en-US';
    utter.rate = 0.86;
    speechSynthesis.speak(utter);
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    els.toast.textContent = message;
    els.toast.classList.add('show');
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1800);
  }

  els.flashcard.addEventListener('click', event => {
    if (event.target.closest('#speakBtn')) return;
    els.flashcard.classList.toggle('flipped');
  });

  els.speakBtn.addEventListener('click', event => {
    event.stopPropagation();
    speakCurrent();
  });

  els.speakBtn.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      event.stopPropagation();
      speakCurrent();
    }
  });

  els.prevBtn.addEventListener('click', () => move(-1));
  els.nextBtn.addEventListener('click', () => move(1));

  els.ratingButtons.forEach(btn => {
    btn.addEventListener('click', () => rate(btn.dataset.rating));
  });

  els.letterFilters.addEventListener('click', event => {
    const btn = event.target.closest('[data-letter]');
    if (!btn) return;
    prefs.letter = btn.dataset.letter;
    savePrefs();
    rebuildDeck({ keepCurrent: false });
  });

  els.modeSelect.addEventListener('change', () => {
    prefs.mode = els.modeSelect.value;
    savePrefs();
    rebuildDeck({ keepCurrent: false });
  });

  els.shuffleToggle.addEventListener('change', () => {
    prefs.shuffle = els.shuffleToggle.checked;
    savePrefs();
    rebuildDeck({ keepCurrent: false });
  });

  els.resetBtn.addEventListener('click', () => {
    const ok = confirm('確定要清除所有「會／模糊／不會」紀錄嗎？單字本身不會刪除。');
    if (!ok) return;
    progress = {};
    saveProgress();
    rebuildDeck({ keepCurrent: false });
    showToast('學習紀錄已重設');
  });

  document.addEventListener('keydown', event => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
    if (event.key === ' ') {
      event.preventDefault();
      els.flashcard.classList.toggle('flipped');
    } else if (event.key === 'ArrowLeft') {
      move(-1);
    } else if (event.key === 'ArrowRight') {
      move(1);
    } else if (event.key === '1') {
      rate('miss');
    } else if (event.key === '2') {
      rate('unsure');
    } else if (event.key === '3') {
      rate('know');
    }
  });

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
    els.installBtn.hidden = false;
  });

  els.installBtn.addEventListener('click', async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    els.installBtn.hidden = true;
  });


  buildLetterFilters();
  rebuildDeck({ keepCurrent: true });
})();

  </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
